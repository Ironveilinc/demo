:root{--ground:#0F172A;--ink:#F0F3F8;--body:#94A3B8;--muted:#79899F;--primary:#C9922F;--link:#E3B65C;--link-hi:#F0CE86;--hairline:#1E2B3F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0F172A;color:var(--body)}
body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:48px 16px;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
main{width:100%;max-width:520px;text-align:center}
.logo{display:block;width:250px;max-width:66%;height:auto;margin:0 auto 48px}
.eyebrow{font-size:10.66px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
h1{font-size:clamp(24px,6vw,30px);font-weight:640;letter-spacing:-.012em;line-height:1.25;color:var(--ink);text-wrap:balance}
h1 em{font-family:"Ironveil Display",Georgia,serif;font-style:italic;font-weight:400;font-size:1.18em;letter-spacing:0;color:var(--primary)}
.rule{width:48px;height:1px;background:var(--hairline);margin:32px auto}
p{font-size:14.4px;line-height:24px;text-wrap:pretty}
a{color:var(--link);text-decoration:none;border-bottom:1px solid rgba(227,182,92,.35)}
a:hover{color:var(--link-hi);border-bottom-color:currentColor}
a:focus-visible{outline:2px solid var(--link);outline-offset:4px;border-radius:2px}
</style>
